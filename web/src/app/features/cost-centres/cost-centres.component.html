<app-page-header title="Cost centres" subtitle="Farm / mill cost centres for allocation.">
  <button type="button" class="btn btn--primary" (click)="showForm.set(true)">Add cost centre</button>
</app-page-header>
@if (error()) { <div class="alert alert--warn">{{ error() }}</div> }
@if (showForm()) {
  <section class="panel form-panel">
    <h2>New cost centre</h2>
    <form class="form-grid" [formGroup]="form" (ngSubmit)="save()">
      <label class="field"><span>Code</span><input formControlName="code" /></label>
      <label class="field"><span>Name</span><input formControlName="name" /></label>
      <label class="field"><span>Location</span><input formControlName="location" /></label>
      <label class="field"><span>Remarks</span><input formControlName="remarks" /></label>
      <div class="form-actions span-2">
        <button type="button" class="btn btn--ghost" (click)="showForm.set(false)">Cancel</button>
        <button type="submit" class="btn btn--primary" [disabled]="saving()">Save</button>
      </div>
    </form>
  </section>
}
<section class="panel">
  <div class="table-wrap">
    <table>
      <thead><tr><th>Code</th><th>Name</th><th>Location</th><th>Active</th></tr></thead>
      <tbody>
        @for (c of items(); track c.id) {
          <tr><td>{{ c.code }}</td><td>{{ c.name }}</td><td>{{ c.location || '—' }}</td><td>{{ c.isActive ? 'Yes' : 'No' }}</td></tr>
        } @empty {
          <tr><td colspan="4" class="empty">No cost centres.</td></tr>
        }
      </tbody>
    </table>
  </div>
</section>
