<app-page-header title="Company settings" subtitle="Legal profile, tax defaults, and FBR options." />

@if (error()) {
  <div class="alert alert--warn">{{ error() }}</div>
}
@if (success()) {
  <div class="alert alert--success">{{ success() }}</div>
}

<section class="panel form-panel">
  @if (loading()) {
    <p class="muted">Loading company…</p>
  } @else {
    <form class="form-grid" [formGroup]="form" (ngSubmit)="save()">
      <label class="field"><span>Company name</span><input formControlName="name" /></label>
      <label class="field"><span>Short name</span><input formControlName="shortName" /></label>
      <label class="field span-2"><span>Address</span><input formControlName="address" /></label>
      <label class="field"><span>City</span><input formControlName="city" /></label>
      <label class="field"><span>Country</span><input formControlName="country" /></label>
      <label class="field"><span>Phone</span><input formControlName="phone" /></label>
      <label class="field"><span>Email</span><input type="email" formControlName="email" /></label>
      <label class="field"><span>Currency</span><input formControlName="currency" /></label>
      <label class="field"><span>NTN</span><input formControlName="ntn" /></label>
      <label class="field">
        <span>Industry</span>
        <select formControlName="industry">
          <option [ngValue]="0">General</option>
          <option [ngValue]="1">Feed mill</option>
          <option [ngValue]="2">Poultry farm</option>
          <option [ngValue]="3">Flour mill</option>
          <option [ngValue]="4">Distribution</option>
        </select>
      </label>
      <label class="field"><span>Default sale tax %</span><input type="number" formControlName="defaultSaleTaxPercent" step="0.01" /></label>
      <label class="field"><span>Default purchase tax %</span><input type="number" formControlName="defaultPurchaseTaxPercent" step="0.01" /></label>
      <label class="field checkbox">
        <input type="checkbox" formControlName="taxModule" />
        <span>Enable tax module on invoices</span>
      </label>
      <label class="field checkbox">
        <input type="checkbox" formControlName="syncToFbr" />
        <span>Sync to FBR (placeholder)</span>
      </label>
      <div class="form-actions span-2">
        <button type="submit" class="btn btn--primary" [disabled]="saving()">
          {{ saving() ? 'Saving…' : 'Save company' }}
        </button>
      </div>
    </form>
  }
</section>
