<section class="login">
  <div class="login__hero">
    <div class="login__atmosphere" aria-hidden="true"></div>
    <div class="login__brand">
      <span class="login__mark">◈</span>
      <h1>SheikhGo-Nexus-ERP</h1>
      <p>One Platform. Every Business Process. — Enterprise business management for finance, procurement, inventory, and operations.</p>
    </div>
  </div>

  <div class="login__panel">
    <form class="login__card" [formGroup]="form" (ngSubmit)="submit()">
      <header>
        <h2>Sign in</h2>
        <p>Access your SheikhGo-Nexus-ERP workspace.</p>
      </header>

      @if (error()) {
        <div class="alert alert--danger">{{ error() }}</div>
      }

      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="username" placeholder="you@company.com" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field__error">Valid email is required</small>
        }
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field__error">Password is required (min 4 characters)</small>
        }
      </label>

      <button class="btn btn--primary btn--block" type="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>

      <p class="login-hint">
        Demo: <code>admin@softaxe.local</code> / <code>Admin&#64;123</code>
      </p>
    </form>
  </div>
</section>
